<header class="site-header">
  <div class="site-header__inner">
    <a routerLink="/travel/search" class="brand" (click)="closeMenu()">
      <svg class="brand__icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="var(--travel-terracotta)" />
        <path
          d="M24 8 L30 22 L24 19 L18 22 Z M24 40 L18 26 L24 29 L30 26 Z"
          fill="var(--travel-cream)"
        />
      </svg>
      <span class="brand__name">Next Trip</span>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="site-nav" [class.site-nav--open]="menuOpen">
      <a routerLink="/travel/search" routerLinkActive="is-active" class="site-nav__link" (click)="closeMenu()">Search</a>
      @if (isLoggedIn) {
        <a routerLink="/dashboard" routerLinkActive="is-active" class="site-nav__link" (click)="closeMenu()">Dashboard</a>
      }

      <div class="site-nav__auth">
        @if (isLoggedIn) {
          <span class="site-nav__user">👋 {{ currentUser?.firstName }}</span>
          <button type="button" class="btn btn--outline" (click)="logout()">Logout</button>
        } @else {
          <a routerLink="/login" class="btn btn--outline" (click)="closeMenu()">Login</a>
          <a routerLink="/signup" class="btn btn--solid" (click)="closeMenu()">Sign Up</a>
        }
      </div>
    </nav>
  </div>
</header>
